<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Mood Beats{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">Mood&nbsp;Beats</a>
      <nav class="topnav">
        <a href="{{ url_for('index') }}" class="{{ 'is-active' if request.path == '/' else '' }}">Find a mood</a>
        <a href="{{ url_for('history') }}" class="{{ 'is-active' if request.path == '/history' else '' }}">History</a>
      </nav>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <span>Tuned by a tiny random forest, not a mood ring.</span>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
